function sFree(d){if(off(d))return'<div class="free">Dzień wolny<small>'+off(d)+'</small></div>';
 const sh=se(d);if(sh.some(e=>!e.from))return'<div class="free">Wydarzenie całodniowe – brak wolnych okien</div>';
 const iv=allDay(d).map(e=>[mi(e[0]),mi(e[1])]).concat(sh.map(e=>[mi(e.from),mi(e.to||e.from)])).sort((a,b)=>a[0]-b[0]);
 if(!iv.length)return'<div class="free">Brak zajęć – cały dzień wolny</div>';
 let t=480,r=[];for(const[a,b]of iv){if(a-t>=30)r.push([t,a]);t=Math.max(t,b)}if(1200-t>=30)r.push([t,1200]);
 return r.length?'<div class="free">Wolne okna (żadna grupa nie ma zajęć):'+r.map(([a,b])=>`<small>• ${hh(a)} – ${hh(b)} (${b-a} min)</small>`).join("")+"</div>":'<div class="free">Brak wolnych okien (8:00–20:00, min. 30 min)</div>'}
function render(){
 $("who").innerHTML=me?`<b style="color:var(--t)">${me.n}</b><br>Grupy: ${me.u?"do ustalenia z prowadzącym":me.k.slice(1).join(", ")}`:"Wybierz studenta, aby zobaczyć swój plan (bez wyboru – wszystkie grupy).";
 document.querySelectorAll(".tabs button").forEach(b=>b.className=b.dataset.v==view?"on":"");
 const now=new Date(),td=iso(new Date(now-now.getTimezoneOffset()*6e4)),hm=now.toTimeString().slice(0,5);
 nextCard();
 let h="";
 if(view=="d"){h=`<div class="nav"><button onclick="mv(-1)">‹</button><button onclick="cur=D('${td}');render()">Dziś</button><button onclick="mv(1)">›</button></div><h2>${fmt(cur)}</h2>`+tl(cur)+freeHtml(cur)+dh(cur,day(cur))}
 if(view=="w"){const m=add(cur,-((cur.getUTCDay()+6)%7));h=`<div class="nav"><button onclick="mv(-7)">‹</button><button onclick="cur=D('${td}');render()">Dziś</button><button onclick="mv(7)">›</button></div>`;
  for(let i=0;i<7;i++){const d=add(m,i),l=day(d);h+=`<h3>${fmt(d)}</h3>`+dh(d,l)}}
 if(view=="k"){h='<p class="m">Kliknij dzień, aby zobaczyć zajęcia</p>';
  for(let mo=9;mo<14;mo++){const y=2026+(mo>11?1:0),mm=mo%12,f=new Date(Date.UTC(y,mm,1)),n=new Date(Date.UTC(y,mm+1,0)).getUTCDate();
   h+=`<h3>${MN[mm]} ${y}</h3><div class="grid">`+["Pon","Wt","Śr","Czw","Pt","Sob","Nie"].map(x=>`<div class="h">${x}</div>`).join("")+"<div class='o'></div>".repeat((f.getUTCDay()+6)%7);
   for(let i=1;i<=n;i++){const d=new Date(Date.UTC(y,mm,i));h+=`<div class="${iso(d)==td?"td ":""}${off(d)?"fr":""}" title="${off(d)||""}" onclick="cur=D('${iso(d)}');view='d';render()">${i}<br>${se(d).length?'<i style="background:#e6b800"></i>':""}${[...new Set(day(d).map(e=>e[4]))].map(s=>`<i style="background:${col(s)}"></i>`).join("")}</div>`}
   h+="</div>"}}
 if(view=="s"){const A=(k,a)=>`<a href="#" onclick="del('${k}','${esc(a.id)}');return false">Usuń</a>`;
  h=`<div class="nav"><button onclick="mv(-1)">‹</button><button onclick="cur=D('${td}');render()">Dziś</button><button onclick="mv(1)">›</button></div><h2>${fmt(cur)}</h2><h3>Wszystkie grupy</h3>`+tl(cur)+sFree(cur)+allDay(cur).slice().sort((a,b)=>a[0].localeCompare(b[0])).map(evh).join("")+se(cur).map(sh=>`<div class="ev all"><small>${esc(sh.from?sh.from+"–"+(sh.to||""):"cały dzień")}</small><b>${esc(sh.title)}</b><small>${esc(sh.place)}</small></div>`).join("")+'<h3>Aktywne wydarzenia</h3>'+(SH.events.map(e=>`<div class="ev all"><small>${esc(e.date)} ${e.from?esc(e.from)+"–"+esc(e.to):"cały dzień"}</small><b>${esc(e.title)}</b><small>${esc(e.place)} · ${A("events",e)}</small></div>`).join("")||'<p class="m">Brak.</p>')+'<h3>Ogłoszenia</h3>'+(SH.ann.map(a=>`<div class="ban"><span>${esc(a.text)}</span><span>${A("ann",a)}</span></div>`).join("")||'<p class="m">Brak.</p>')}
 $("adm").hidden=view!="s";
 $("view").innerHTML=h;
 let hid=[];try{hid=JSON.parse(localStorage.getItem("hid")||"[]")}catch(e){}
 $("ann").innerHTML=SH.ann.filter(a=>!hid.includes(a.id)).map(a=>`<div class="ban"><span>${esc(a.text)}</span><span><a href="#" onclick="hide('${esc(a.id)}');return false">Ukryj</a></span></div>`).join("");
 $("leg").innerHTML='<b>Legenda kolorów:</b><br><span><i style="background:#2e9e5b"></i> Dzień wolny</span>'+subj.map(s=>`<span><i style="background:${col(s)}"></i> ${s}</span>`).join("")}
function mv(n){cur=add(cur,n);render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$("q").oninput=e=>{const v=e.target.value.toLowerCase().trim();$("sug").innerHTML=v?P.filter(p=>p.n.toLowerCase().includes(v)).slice(0,6).map(p=>`<div data-n="${p.n}">${p.n}<br><small>${p.u?"grupa do ustalenia":p.k.slice(1).join(", ")}</small></div>`).join(""):""};
$("sug").onclick=e=>{const n=e.target.closest("[data-n]");if(!n)return;me=P.find(p=>p.n==n.dataset.n);try{localStorage.setItem("stu",me.n)}catch(x){}$("q").value="";$("sug").innerHTML="";render()};
$("ics").onclick=()=>{if(!me){alert("Najpierw wybierz studenta.");return}
 const m=$("rem").value,x=t=>String(t).replace(/[,;]/g,"\\$&"),st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
 t0=D(iso(new Date(Date.now()-new Date().getTimezoneOffset()*6e4))),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Plan zajec//PL","CALSCALE:GREGORIAN"];
 for(let i=0;i<220;i++){const d=add(t0,i),ds=iso(d).replace(/-/g,"");day(d).forEach(e=>{
  L.push("BEGIN:VEVENT","UID:"+ds+e[0].replace(":","")+subj.indexOf(e[4])+e[5]+"@plan","DTSTAMP:"+st,"DTSTART:"+ds+"T"+e[0].replace(":","")+"00","DTEND:"+ds+"T"+e[1].replace(":","")+"00","SUMMARY:"+x(e[4]),"LOCATION:"+x(e[6]=="online"?"On-line":(PL[e[6]]||e[6])+(e[7]?", sala "+e[7]:"")));
  if(m!="0")L.push("BEGIN:VALARM","TRIGGER:-PT"+m+"M","ACTION:DISPLAY","DESCRIPTION:"+x(e[4]),"END:VALARM");L.push("END:VEVENT")})}
 L.push("END:VCALENDAR");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="plan.ics";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1e3)};
const msg=t=>$("msg").textContent=t;
async function post(b){b.key=$("k").value;if(!b.key){msg("Wpisz hasło starosty.");return}
 try{const r=await fetch("/api",{method:"POST",body:JSON.stringify(b)});if(r.status==403){msg("Złe hasło.");return}if(!r.ok){let t="";try{t=(await r.json()).error||""}catch(e){}msg("Błąd zapisu ("+r.status+")"+(t?": "+t:"")+".");return}
  SH=await r.json();try{localStorage.setItem("key",b.key)}catch(e){}msg("Zapisano.");render()}catch(e){msg("Brak połączenia z serwerem.")}}
function del(kind,id){if(!$("k").value){alert("Najpierw wpisz hasło starosty w zakładce Starosta.");return}if(confirm("Usunąć dla wszystkich?"))post({op:"del",kind,id})}
function hide(id){let h=[];try{h=JSON.parse(localStorage.getItem("hid")||"[]");h.push(id);localStorage.setItem("hid",JSON.stringify(h))}catch(e){}render()}
$("addE").onclick=()=>{if(!$("etl").value||!$("ed").value){msg("Podaj tytuł i datę.");return}post({op:"addEvent",title:$("etl").value,date:$("ed").value,from:$("ef").value,to:$("eto").value,place:$("ep").value})};
$("addA").onclick=()=>{if(!$("at").value){msg("Wpisz treść.");return}post({op:"addAnn",text:$("at").value});$("at").value=""};
try{$("k").value=localStorage.getItem("key")||""}catch(e){}
$("ed").value=iso(cur);
(async()=>{try{const r=await fetch("/api");if(r.ok)SH=await r.json()}catch(e){}render()})();
render();
setInterval(nextCard,3e4);
</script></body></html>
